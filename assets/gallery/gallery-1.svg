<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="60%" stop-color="#0c0e18"/>
      <stop offset="100%" stop-color="#19170e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe17a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffc928" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b0"/>
      <stop offset="50%" stop-color="#ffc928"/>
      <stop offset="100%" stop-color="#d89408"/>
    </linearGradient>
    <linearGradient id="lunarSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2822"/>
      <stop offset="100%" stop-color="#12110d"/>
    </linearGradient>
  </defs>

  <!-- Space Background -->
  <rect width="600" height="450" fill="url(#spaceGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="45" cy="50" r="1.5"/>
    <circle cx="120" cy="80" r="1"/>
    <circle cx="210" cy="35" r="2"/>
    <circle cx="340" cy="65" r="1.2"/>
    <circle cx="480" cy="40" r="1.8"/>
    <circle cx="550" cy="95" r="1.2"/>
    <circle cx="90" cy="160" r="1"/>
    <circle cx="510" cy="180" r="1.5"/>
    <circle cx="270" cy="120" r="1.2"/>
    <circle cx="420" cy="110" r="1"/>
    <polygon points="520,70 523,78 531,81 523,84 520,92 517,84 509,81 517,78" fill="#ffc928" opacity="0.8"/>
    <polygon points="150,110 152,115 157,117 152,119 150,124 148,119 143,117 148,115" fill="#ffc928" opacity="0.6"/>
  </g>

  <!-- Earth in distant sky -->
  <circle cx="130" cy="100" r="32" fill="#1e3a8a"/>
  <circle cx="126" cy="96" r="30" fill="#0284c7" opacity="0.7"/>
  <path d="M115 88 Q130 92 125 108 Q140 100 148 112 Q142 125 120 120 Z" fill="#22c55e" opacity="0.85"/>
  <circle cx="130" cy="100" r="32" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4"/>

  <!-- Moon Glow & Giant Moon Horizon -->
  <ellipse cx="300" cy="530" rx="360" ry="220" fill="url(#lunarSurface)" stroke="rgba(255,201,40,0.3)" stroke-width="2"/>
  
  <!-- Craters -->
  <ellipse cx="140" cy="370" rx="45" ry="14" fill="#181713" stroke="#333129" stroke-width="1.5"/>
  <ellipse cx="460" cy="390" rx="60" ry="18" fill="#181713" stroke="#333129" stroke-width="1.5"/>
  <ellipse cx="280" cy="415" rx="35" ry="10" fill="#181713" stroke="#333129" stroke-width="1"/>

  <!-- MEMETEK Flag planted on Moon -->
  <line x1="420" y1="210" x2="420" y2="350" stroke="#ffc928" stroke-width="4" stroke-linecap="round"/>
  <polygon points="420,210 495,230 420,255" fill="url(#goldGrad)" stroke="#ffc928" stroke-width="1.5"/>
  <text x="432" y="238" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#111">MEME</text>

  <!-- Astronaut Cat -->
  <!-- Cat Backpack / Oxygen tank -->
  <rect x="230" y="215" width="40" height="75" rx="8" fill="#2a2822" stroke="#ffc928" stroke-width="2"/>
  <!-- Cat Body in Astronaut Suit -->
  <ellipse cx="285" cy="270" rx="42" ry="52" fill="#e8e5dc"/>
  <ellipse cx="285" cy="270" rx="38" ry="48" fill="#f5f3ec"/>
  
  <!-- Golden Belt & Chest Patch -->
  <rect x="255" y="275" width="60" height="10" rx="3" fill="#ffc928"/>
  <rect x="270" y="245" width="30" height="18" rx="4" fill="#111"/>
  <circle cx="280" cy="254" r="4" fill="#22c55e"/>
  <circle cx="290" cy="254" r="3" fill="#ffc928"/>

  <!-- Legs & Boots -->
  <rect x="260" y="315" width="20" height="35" rx="6" fill="#e8e5dc"/>
  <ellipse cx="268" cy="350" rx="15" ry="8" fill="#ffc928"/>
  <rect x="295" y="315" width="20" height="35" rx="6" fill="#e8e5dc"/>
  <ellipse cx="305" cy="350" rx="15" ry="8" fill="#ffc928"/>

  <!-- Tail in Space Suit tube -->
  <path d="M245 285 Q205 270 215 235 Q225 210 210 200" fill="none" stroke="#e8e5dc" stroke-width="12" stroke-linecap="round"/>
  <path d="M245 285 Q205 270 215 235 Q225 210 210 200" fill="none" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>

  <!-- Space Helmet -->
  <circle cx="285" cy="185" r="50" fill="rgba(255,201,40,0.15)" stroke="#ffc928" stroke-width="3"/>
  <!-- Helmet Ears -->
  <path d="M250 145 L260 120 L275 138 Z" fill="#2a2822" stroke="#ffc928" stroke-width="2"/>
  <path d="M320 145 L310 120 L295 138 Z" fill="#2a2822" stroke="#ffc928" stroke-width="2"/>
  
  <!-- Cat Face inside visor -->
  <circle cx="285" cy="185" r="38" fill="#111"/>
  <!-- Cat Eyes -->
  <ellipse cx="272" cy="180" rx="6" ry="8" fill="#ffc928"/>
  <ellipse cx="298" cy="180" rx="6" ry="8" fill="#ffc928"/>
  <circle cx="272" cy="180" r="3" fill="#111"/>
  <circle cx="298" cy="180" r="3" fill="#111"/>
  <!-- Visor Gold Reflection -->
  <path d="M255 165 Q285 155 315 168 Q310 185 290 178 Q270 175 255 165 Z" fill="url(#goldGrad)" opacity="0.6"/>
  <!-- Whiskers -->
  <line x1="250" y1="190" x2="235" y2="188" stroke="#ffc928" stroke-width="1.5"/>
  <line x1="250" y1="195" x2="233" y2="198" stroke="#ffc928" stroke-width="1.5"/>
  <line x1="320" y1="190" x2="335" y2="188" stroke="#ffc928" stroke-width="1.5"/>
  <line x1="320" y1="195" x2="337" y2="198" stroke="#ffc928" stroke-width="1.5"/>

  <!-- Meme Header Banner -->
  <rect x="30" y="25" width="220" height="28" rx="14" fill="rgba(17,17,15,0.85)" stroke="rgba(255,201,40,0.4)" stroke-width="1"/>
  <text x="44" y="43" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#ffc928" letter-spacing="1">✦ MISSION TO THE MOON</text>
</svg>
