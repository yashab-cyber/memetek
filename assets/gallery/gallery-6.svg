<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="#0f0e0c"/>

  <!-- Subtle dot pattern background -->
  <g fill="rgba(255,201,40,0.15)">
    <circle cx="50" cy="50" r="2"/><circle cx="100" cy="50" r="2"/><circle cx="150" cy="50" r="2"/><circle cx="200" cy="50" r="2"/><circle cx="250" cy="50" r="2"/><circle cx="300" cy="50" r="2"/><circle cx="350" cy="50" r="2"/><circle cx="400" cy="50" r="2"/><circle cx="450" cy="50" r="2"/><circle cx="500" cy="50" r="2"/><circle cx="550" cy="50" r="2"/>
    <circle cx="50" cy="150" r="2"/><circle cx="100" cy="150" r="2"/><circle cx="150" cy="150" r="2"/><circle cx="200" cy="150" r="2"/><circle cx="250" cy="150" r="2"/><circle cx="300" cy="150" r="2"/><circle cx="350" cy="150" r="2"/><circle cx="400" cy="150" r="2"/><circle cx="450" cy="150" r="2"/><circle cx="500" cy="150" r="2"/><circle cx="550" cy="150" r="2"/>
    <circle cx="50" cy="250" r="2"/><circle cx="100" cy="250" r="2"/><circle cx="150" cy="250" r="2"/><circle cx="200" cy="250" r="2"/><circle cx="250" cy="250" r="2"/><circle cx="300" cy="250" r="2"/><circle cx="350" cy="250" r="2"/><circle cx="400" cy="250" r="2"/><circle cx="450" cy="250" r="2"/><circle cx="500" cy="250" r="2"/><circle cx="550" cy="250" r="2"/>
    <circle cx="50" cy="350" r="2"/><circle cx="100" cy="350" r="2"/><circle cx="150" cy="350" r="2"/><circle cx="200" cy="350" r="2"/><circle cx="250" cy="350" r="2"/><circle cx="300" cy="350" r="2"/><circle cx="350" cy="350" r="2"/><circle cx="400" cy="350" r="2"/><circle cx="450" cy="350" r="2"/><circle cx="500" cy="350" r="2"/><circle cx="550" cy="350" r="2"/>
  </g>

  <!-- Sticker 1: "HODL" badge (Top Left) -->
  <g transform="translate(60, 90) rotate(-6)" filter="url(#stickerShadow)">
    <!-- White Die-Cut Border -->
    <rect x="-6" y="-6" width="212" height="132" rx="20" fill="#ffffff"/>
    <rect x="0" y="0" width="200" height="120" rx="16" fill="#111111" stroke="#ffc928" stroke-width="3"/>
    <circle cx="45" cy="60" r="28" fill="#ffc928"/>
    <text x="45" y="69" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="24" fill="#111" text-anchor="middle">🐈‍⬛</text>
    <text x="85" y="55" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="28" fill="#ffc928">HODL</text>
    <text x="87" y="80" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#fff" letter-spacing="1">NO WEAK PAWS</text>
  </g>

  <!-- Sticker 2: "MOON MISSION" circular badge (Top Right) -->
  <g transform="translate(350, 75) rotate(8)" filter="url(#stickerShadow)">
    <circle cx="95" cy="75" r="75" fill="#ffffff"/>
    <circle cx="95" cy="75" r="70" fill="#ffc928"/>
    <circle cx="95" cy="75" r="64" fill="#111"/>
    <text x="95" y="55" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#ffc928" text-anchor="middle" letter-spacing="2">★ DESTINATION ★</text>
    <text x="95" y="85" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">MOON</text>
    <text x="95" y="105" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#ffc928" text-anchor="middle">MEMETEK CREW</text>
  </g>

  <!-- Sticker 3: "NO GATEKEEPING" banner (Bottom Left) -->
  <g transform="translate(70, 260) rotate(4)" filter="url(#stickerShadow)">
    <polygon points="-6,10 236,-6 246,86 4,102" fill="#ffffff"/>
    <polygon points="0,15 230,0 240,80 10,95" fill="#ffc928"/>
    <text x="120" y="45" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="18" fill="#111" text-anchor="middle" transform="rotate(-3.5 120 45)">NO GATEKEEPING</text>
    <text x="120" y="70" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#111" text-anchor="middle" letter-spacing="1" transform="rotate(-3.5 120 70)">ALL HUMANS &amp; CATS WELCOME</text>
  </g>

  <!-- Sticker 4: "GM TO THE CREW" stamp (Bottom Right) -->
  <g transform="translate(340, 255) rotate(-5)" filter="url(#stickerShadow)">
    <rect x="-5" y="-5" width="190" height="110" rx="14" fill="#ffffff"/>
    <rect x="0" y="0" width="180" height="100" rx="10" fill="#1e1b12" stroke="#ffc928" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="90" y="45" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="34" fill="#ffc928" text-anchor="middle">GM ☕</text>
    <text x="90" y="75" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#fff" text-anchor="middle" letter-spacing="1">TO THE CREW</text>
  </g>

  <!-- Meme Header Banner -->
  <rect x="30" y="25" width="220" height="28" rx="14" fill="rgba(17,17,15,0.85)" stroke="rgba(255,201,40,0.5)" stroke-width="1"/>
  <text x="44" y="43" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#ffc928" letter-spacing="1">✨ OFFICIAL STICKER PACK</text>
</svg>
