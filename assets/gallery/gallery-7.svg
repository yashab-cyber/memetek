<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="#060608"/>

  <!-- Glowing Monitors Desk Setup -->
  <!-- Center Monitor -->
  <rect x="180" y="80" width="240" height="160" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
  <rect x="186" y="86" width="228" height="148" fill="#090d10"/>
  <!-- Chart inside Center Monitor -->
  <path d="M190 200 L230 180 L260 210 L300 150 L340 170 L380 110 L410 95" fill="none" stroke="url(#chartLine)" stroke-width="3"/>
  <!-- Area under chart -->
  <path d="M190 200 L230 180 L260 210 L300 150 L340 170 L380 110 L410 95 L410 230 L190 230 Z" fill="url(#screenGlow)"/>
  <text x="195" y="105" font-family="monospace" font-size="10" fill="#22c55e">$MEMETEK / SOL: +340.5%</text>

  <!-- Left Monitor (angled) -->
  <g transform="skewY(6) translate(-10, -20)">
    <rect x="40" y="110" width="130" height="150" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="50" y="130" font-family="monospace" font-size="9" fill="#58a6ff">[TELEGRAM FEED]</text>
    <text x="50" y="148" font-family="monospace" font-size="8" fill="#8b949e">Anon: moon soon?</text>
    <text x="50" y="164" font-family="monospace" font-size="8" fill="#eab308">Mod: yes, check ca</text>
    <text x="50" y="180" font-family="monospace" font-size="8" fill="#8b949e">Degen: bought 10 SOL</text>
    <text x="50" y="196" font-family="monospace" font-size="8" fill="#22c55e">Bot: NEW ATH!</text>
  </g>

  <!-- Right Monitor (angled) -->
  <g transform="skewY(-6) translate(30, 20)">
    <rect x="400" y="70" width="130" height="150" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="410" y="90" font-family="monospace" font-size="9" fill="#58a6ff">[ORDER BOOK]</text>
    <text x="410" y="108" font-family="monospace" font-size="8" fill="#22c55e">0.00420 SOL - BUY</text>
    <text x="410" y="124" font-family="monospace" font-size="8" fill="#22c55e">0.00418 SOL - BUY</text>
    <text x="410" y="140" font-family="monospace" font-size="8" fill="#22c55e">0.00415 SOL - BUY</text>
    <text x="410" y="156" font-family="monospace" font-size="8" fill="#ff7b72">0.00425 SOL - SELL</text>
  </g>

  <!-- Monitor Stands -->
  <rect x="290" y="240" width="20" height="40" fill="#21262d"/>
  <ellipse cx="300" cy="280" rx="40" ry="10" fill="#161b22"/>

  <!-- Trader Cat (View from back/side in gaming chair) -->
  <!-- Gaming Chair Headrest -->
  <rect x="250" y="220" width="100" height="140" rx="20" fill="#1b1710" stroke="#ffc928" stroke-width="2"/>
  <!-- Cat Head -->
  <circle cx="300" cy="270" r="42" fill="#12110e"/>
  <!-- Gaming Headset -->
  <path d="M255 270 Q255 220 300 220 Q345 220 345 270" fill="none" stroke="#ffc928" stroke-width="8"/>
  <rect x="248" y="260" width="14" height="26" rx="6" fill="#ffc928"/>
  <rect x="338" y="260" width="14" height="26" rx="6" fill="#ffc928"/>
  <!-- Cat Ears poking through -->
  <polygon points="265,230 255,200 280,220" fill="#12110e" stroke="#ffc928" stroke-width="1.5"/>
  <polygon points="335,230 345,200 320,220" fill="#12110e" stroke="#ffc928" stroke-width="1.5"/>

  <!-- Coffee Mug steaming on Desk -->
  <rect x="440" y="320" width="30" height="40" rx="4" fill="#ffc928"/>
  <path d="M470 330 Q485 340 470 350" fill="none" stroke="#ffc928" stroke-width="3"/>
  <text x="455" y="345" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="10" fill="#111" text-anchor="middle">M</text>
  <!-- Coffee steam -->
  <path d="M450 315 Q445 300 455 290 Q465 280 455 270" fill="none" stroke="#bcb9af" stroke-width="2" opacity="0.6"/>

  <!-- Meme Header Banner -->
  <rect x="30" y="25" width="220" height="28" rx="14" fill="rgba(17,17,15,0.85)" stroke="rgba(255,201,40,0.5)" stroke-width="1"/>
  <text x="44" y="43" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#ffc928" letter-spacing="1">☕ 3 AM TERMINAL VIBES</text>
</svg>
