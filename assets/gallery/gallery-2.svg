<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0812"/>
      <stop offset="50%" stop-color="#141108"/>
      <stop offset="100%" stop-color="#070604"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#cyberBg)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255,201,40,0.12)" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Glowing Hexagons -->
  <polygon points="120,60 140,50 160,60 160,80 140,90 120,80" fill="none" stroke="#ffc928" stroke-width="1.5" opacity="0.3"/>
  <polygon points="460,70 480,60 500,70 500,90 480,100 460,90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
  <polygon points="80,360 100,350 120,360 120,380 100,390 80,380" fill="none" stroke="#ffc928" stroke-width="1.5" opacity="0.3"/>
  <polygon points="500,350 520,340 540,350 540,370 520,380 500,370" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

  <!-- Halo Ring behind Head -->
  <circle cx="300" cy="200" r="140" fill="none" stroke="#ffc928" stroke-width="2" stroke-dasharray="10, 8" opacity="0.5"/>
  <circle cx="300" cy="200" r="160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4, 12" opacity="0.4"/>

  <!-- Cat Silhouette & Head -->
  <path d="M220 220 L200 110 L250 140 L300 130 L350 140 L400 110 L380 220 Z" fill="#12110e" stroke="#ffc928" stroke-width="2"/>
  <ellipse cx="300" cy="220" rx="90" ry="75" fill="#171510" stroke="#ffc928" stroke-width="2"/>
  
  <!-- Inner Ears (neon pink/gold) -->
  <polygon points="215,130 235,145 220,185" fill="#e11d48" opacity="0.8"/>
  <polygon points="385,130 365,145 380,185" fill="#e11d48" opacity="0.8"/>

  <!-- Laser Eyes with Beams shooting outward! -->
  <!-- Left Eye -->
  <circle cx="265" cy="205" r="14" fill="#ffc928" filter="url(#neonGlow)"/>
  <circle cx="265" cy="205" r="7" fill="#ffffff"/>
  <!-- Right Eye -->
  <circle cx="335" cy="205" r="14" fill="#ffc928" filter="url(#neonGlow)"/>
  <circle cx="335" cy="205" r="7" fill="#ffffff"/>

  <!-- Beams -->
  <polygon points="265,205 0,160 0,180" fill="rgba(255,201,40,0.4)" filter="url(#neonGlow)"/>
  <line x1="265" y1="205" x2="0" y2="170" stroke="#fff" stroke-width="2"/>
  <polygon points="335,205 600,160 600,180" fill="rgba(255,201,40,0.4)" filter="url(#neonGlow)"/>
  <line x1="335" y1="205" x2="600" y2="170" stroke="#fff" stroke-width="2"/>

  <!-- Cyber Visor Line across face -->
  <line x1="235" y1="205" x2="365" y2="205" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
  <polygon points="300,225 292,235 308,235" fill="#ffc928"/>

  <!-- Whiskers (laser styled) -->
  <line x1="240" y1="230" x2="160" y2="225" stroke="#ffc928" stroke-width="1.5"/>
  <line x1="240" y1="238" x2="155" y2="245" stroke="#ffc928" stroke-width="1.5"/>
  <line x1="360" y1="230" x2="440" y2="225" stroke="#ffc928" stroke-width="1.5"/>
  <line x1="360" y1="238" x2="445" y2="245" stroke="#ffc928" stroke-width="1.5"/>

  <!-- Diamond Paws (Left & Right) -->
  <!-- Left Diamond Paw -->
  <g transform="translate(190, 310)">
    <polygon points="30,0 60,30 30,70 0,30" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Facets -->
    <line x1="0" y1="30" x2="60" y2="30" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="30" y1="0" x2="30" y2="70" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="20,10 40,10 50,30 10,30" fill="rgba(255,255,255,0.4)"/>
    <text x="30" y="90" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#7dd3fc" text-anchor="middle">HODL</text>
  </g>

  <!-- Right Diamond Paw -->
  <g transform="translate(350, 310)">
    <polygon points="30,0 60,30 30,70 0,30" fill="url(#diamondGrad)" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)"/>
    <!-- Facets -->
    <line x1="0" y1="30" x2="60" y2="30" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="30" y1="0" x2="30" y2="70" stroke="#ffffff" stroke-width="1.5"/>
    <polygon points="20,10 40,10 50,30 10,30" fill="rgba(255,255,255,0.4)"/>
    <text x="30" y="90" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#7dd3fc" text-anchor="middle">PAWS</text>
  </g>

  <!-- Meme Header Banner -->
  <rect x="30" y="25" width="220" height="28" rx="14" fill="rgba(17,17,15,0.85)" stroke="rgba(56,189,248,0.5)" stroke-width="1"/>
  <text x="44" y="43" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="1">💎 DIAMOND PAWS MODE</text>
</svg>
