<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="solanaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffa3"/>
      <stop offset="50%" stop-color="#03e1ff"/>
      <stop offset="100%" stop-color="#dc1fff"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc928" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#00ffa3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Deep Dark Speed Warp Background -->
  <rect width="600" height="450" fill="#08080a"/>

  <!-- Speed Lines -->
  <g stroke="#ffffff" opacity="0.3" stroke-width="1.5">
    <line x1="0" y1="400" x2="600" y2="120" stroke-dasharray="100, 40"/>
    <line x1="0" y1="440" x2="600" y2="160" stroke-dasharray="80, 50"/>
    <line x1="20" y1="360" x2="580" y2="90" stroke-dasharray="120, 30"/>
    <line x1="50" y1="420" x2="600" y2="200" stroke-dasharray="60, 60"/>
  </g>

  <!-- Solana Light Ribbon Beam -->
  <path d="M-50 480 Q250 350 450 180 T650 40" fill="none" stroke="url(#solanaGrad)" stroke-width="16" opacity="0.9"/>
  <path d="M-50 480 Q250 350 450 180 T650 40" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Surfing Cat on Solana Surfboard -->
  <!-- Surfboard -->
  <g transform="rotate(-30 320 220)">
    <ellipse cx="320" cy="270" rx="140" ry="22" fill="url(#solanaGrad)" stroke="#ffffff" stroke-width="2"/>
    <text x="320" y="275" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#111" text-anchor="middle" letter-spacing="3">SOLANA FAST</text>
    
    <!-- Surfer Cat on board -->
    <!-- Cat Body -->
    <ellipse cx="320" cy="200" rx="35" ry="48" fill="#171511" stroke="#ffc928" stroke-width="2"/>
    <!-- Sunglasses (Cool Shades) -->
    <rect x="290" y="145" width="28" height="18" rx="4" fill="#00ffa3"/>
    <rect x="322" y="145" width="28" height="18" rx="4" fill="#03e1ff"/>
    <line x1="318" y1="154" x2="322" y2="154" stroke="#ffc928" stroke-width="3"/>
    
    <!-- Cat Ears -->
    <polygon points="285,135 275,100 305,120" fill="#171511" stroke="#ffc928" stroke-width="2"/>
    <polygon points="355,135 365,100 335,120" fill="#171511" stroke="#ffc928" stroke-width="2"/>
    
    <!-- Cape fluttering in hyperspeed -->
    <path d="M295 190 Q220 180 180 150 Q230 210 295 210 Z" fill="#ffc928"/>

    <!-- Paws gripping board -->
    <ellipse cx="295" cy="260" rx="12" ry="7" fill="#ffc928"/>
    <ellipse cx="345" cy="260" rx="12" ry="7" fill="#ffc928"/>
  </g>

  <!-- Speed HUD Stats -->
  <rect x="30" y="25" width="230" height="28" rx="14" fill="rgba(17,17,15,0.85)" stroke="rgba(0,255,163,0.5)" stroke-width="1"/>
  <text x="44" y="43" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#00ffa3" letter-spacing="1">⚡ 400MS FINALITY SPEED</text>

  <rect x="420" y="380" width="150" height="34" rx="6" fill="rgba(17,17,15,0.9)" stroke="#03e1ff" stroke-width="1.5"/>
  <text x="495" y="402" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#03e1ff" text-anchor="middle">TPS: OVER 9,000</text>
</svg>
