<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rocketSky" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="60%" stop-color="#0f1510"/>
      <stop offset="100%" stop-color="#05120a"/>
    </linearGradient>
    <linearGradient id="greenCandle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffe17a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#rocketSky)"/>

  <!-- Trading Chart Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
  </g>

  <!-- Smaller trading candles leading up to the rocket -->
  <!-- Candle 1 -->
  <line x1="60" y1="380" x2="60" y2="420" stroke="#ef4444" stroke-width="2"/>
  <rect x="52" y="390" width="16" height="20" fill="#ef4444" rx="2"/>

  <!-- Candle 2 -->
  <line x1="110" y1="350" x2="110" y2="410" stroke="#22c55e" stroke-width="2"/>
  <rect x="102" y="360" width="16" height="35" fill="#22c55e" rx="2"/>

  <!-- Candle 3 -->
  <line x1="160" y1="330" x2="160" y2="380" stroke="#22c55e" stroke-width="2"/>
  <rect x="152" y="340" width="16" height="30" fill="#22c55e" rx="2"/>

  <!-- Candle 4 -->
  <line x1="210" y1="290" x2="210" y2="360" stroke="#22c55e" stroke-width="2"/>
  <rect x="202" y="300" width="16" height="50" fill="#22c55e" rx="2"/>

  <!-- The GIANT Rocket Candlestick -->
  <!-- Upper Wick / Antenna -->
  <line x1="330" y1="30" x2="330" y2="90" stroke="#22c55e" stroke-width="4"/>
  <circle cx="330" cy="30" r="5" fill="#4ade80"/>

  <!-- Rocket Body (The Mega Candle) -->
  <path d="M300 120 Q330 75 360 120 L360 280 L300 280 Z" fill="url(#greenCandle)" stroke="#86efac" stroke-width="2"/>
  
  <!-- Rocket Window with Cat inside -->
  <circle cx="330" cy="160" r="28" fill="#111" stroke="#ffc928" stroke-width="3"/>
  <circle cx="330" cy="160" r="23" fill="#1a1812"/>
  <!-- Cat Face inside window -->
  <ellipse cx="330" cy="165" rx="15" ry="12" fill="#222"/>
  <polygon points="318,154 322,142 328,152" fill="#222"/>
  <polygon points="342,154 338,142 332,152" fill="#222"/>
  <circle cx="325" cy="162" r="3" fill="#ffc928"/>
  <circle cx="335" cy="162" r="3" fill="#ffc928"/>

  <!-- Rocket Fins -->
  <polygon points="300,240 260,285 300,280" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
  <polygon points="360,240 400,285 360,280" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
  
  <!-- Text on Rocket: $MEMETEK -->
  <g transform="rotate(-90 330 220)">
    <text x="290" y="225" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#052e16" letter-spacing="3">$MEMETEK</text>
  </g>

  <!-- Rocket Engine Thruster & Flames -->
  <polygon points="310,280 350,280 342,295 318,295" fill="#333"/>
  <!-- Thrust Flame -->
  <path d="M315 295 Q330 380 325 430 Q330 370 335 440 Q340 370 345 295 Z" fill="url(#flameGrad)"/>
  <path d="M322 295 Q330 340 327 380 Q330 350 333 390 Q335 340 338 295 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Stars & Moon in top right -->
  <circle cx="500" cy="70" r="40" fill="#ffe17a" opacity="0.9"/>
  <circle cx="512" cy="65" r="36" fill="#080808"/>

  <!-- Dotted Trajectory Line to Moon -->
  <path d="M330 80 Q350 40 460 70" fill="none" stroke="#ffc928" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Indicator Badges -->
  <rect x="30" y="25" width="220" height="28" rx="14" fill="rgba(17,17,15,0.85)" stroke="rgba(34,197,94,0.5)" stroke-width="1"/>
  <text x="44" y="43" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#4ade80" letter-spacing="1">🚀 GOD CANDLE CONFIRMED</text>

  <rect x="420" y="390" width="150" height="30" rx="4" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
  <text x="495" y="410" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#4ade80" text-anchor="middle">+4,200% PUMP</text>
</svg>
